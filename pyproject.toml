[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kol-monitor"
version = "0.1.0"
description = "Daily US stock KOL X/Twitter monitor and AI digest publisher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "anthropic>=0.40",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pillow>=10.0",
  "tenacity>=8.2",
  "rich>=13.0",
  "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "freezegun>=1.4",
]

[project.scripts]
kol-monitor = "kol_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
